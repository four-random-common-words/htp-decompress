name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same ref supersedes the running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads rust-toolchain.toml (Rust 1.100.0, wasm32 target, rustfmt, clippy).
      - uses: actions-rust-lang/setup-rust-toolchain@v2

      # Installs Node from mise.toml and trusts its tasks. The version matches min_version there.
      - uses: jdx/mise-action@v5
        with:
          version: 2026.8.14

      # The same tasks as `mise run check`, one step each so a failure shows where it happened.
      - run: mise run lint:fmt
      - run: mise run lint:clippy
      - run: mise run lint:wasm
      - run: mise run test:rust

      - run: mise run deps

      # Also appends the wasm size table to $GITHUB_STEP_SUMMARY.
      - run: mise run build

      # Both reuse the build above, since nothing it reads changed.
      - run: mise run test:npm
      - run: mise run typecheck
