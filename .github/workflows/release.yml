name: release

on:
  push:
    tags:
      - "v*"

# Every job reads only; publish asks for what it needs on its own.
permissions:
  contents: read

jobs:
  # Checks, tests and packs the package. The tarball it uploads is the one publish ships.
  build:
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@v7

      # Reads rust-toolchain.toml (Rust 1.100.0, wasm32 target, rustfmt, clippy).
      - uses: actions-rust-lang/setup-rust-toolchain@v2

      # Must match mise.toml. setup-node@v4 cannot read that file.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Check the tag against all three versions
        run: |
          npm_version=$(node -p "require('./npm/package.json').version")
          crate_versions=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[].version' | sort -u)
          echo "tag=$GITHUB_REF_NAME npm=$npm_version crates=$crate_versions"
          test "$GITHUB_REF_NAME" = "v$npm_version"
          test "$GITHUB_REF_NAME" = "v$crate_versions"

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

      # One module per format, as in ci.yml.
      - name: Clippy wasm crate (gzip)
        run: cargo clippy -p htp-decompress-wasm --target wasm32-unknown-unknown --no-default-features --features gzip --locked -- -D warnings
      - name: Clippy wasm crate (xz)
        run: cargo clippy -p htp-decompress-wasm --target wasm32-unknown-unknown --no-default-features --features xz --locked -- -D warnings
      - name: Clippy wasm crate (zstd)
        run: cargo clippy -p htp-decompress-wasm --target wasm32-unknown-unknown --no-default-features --features zstd --locked -- -D warnings

      - run: cargo test --locked

      # The toolchain action denies warnings for the whole job; only the vendored manifest's upstream
      # warning is allowed, as in ci.yml.
      - name: Test vendored ruzstd
        run: cargo test --manifest-path vendor/ruzstd/Cargo.toml --locked
        env:
          CARGO_BUILD_WARNINGS: allow

      - run: npm ci
        working-directory: npm
      - run: npm run build
        working-directory: npm
      - run: npm test
        working-directory: npm
      - run: npm run typecheck
        working-directory: npm

      # The tarball is built once; the published file and the release asset are the same artifact.
      - id: pack
        run: echo "tarball=$(npm pack --silent)" >> "$GITHUB_OUTPUT"
        working-directory: npm

      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: npm/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  # Publishes the tarball from build and creates the GitHub release. It checks nothing out: the
  # tarball is all it needs.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # id-token: npm trusted publishing (OIDC) and provenance. contents: create the GitHub release.
      id-token: write
      contents: write
    steps:
      # Node 24.18.0 ships npm 11.16.0; trusted publishing needs 11.5.1 or newer.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v8
        with:
          name: npm-package

      # A re-run skips the publish when the version is already on npm (versions are immutable), so a
      # failure in a later step can be recovered by re-running this job. No token secret: npm
      # authenticates through the trusted publisher configured on npmjs.com. The build job checked
      # that the tag is v plus the package version.
      - name: Publish to npm
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if published=$(npm view "htp-decompress@$version" version 2>view-error.txt); then
            :
          elif grep -q E404 view-error.txt; then
            published=""
          else
            cat view-error.txt
            exit 1
          fi
          if [ "$published" = "$version" ]; then
            echo "htp-decompress@$version is already on npm, skipping the publish"
          else
            npm publish "$TARBALL" --provenance --access public
          fi

      - uses: softprops/action-gh-release@v3
        with:
          files: ${{ needs.build.outputs.tarball }}
