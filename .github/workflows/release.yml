name: release

on:
  push:
    tags:
      - "v*"

# Every job reads only; publish asks for what it needs on its own.
permissions:
  contents: read

jobs:
  # Checks, tests and packs the package. The tarball it uploads is the one publish ships.
  build:
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@v7

      # Reads rust-toolchain.toml (Rust 1.100.0, wasm32 target, rustfmt, clippy).
      - uses: actions-rust-lang/setup-rust-toolchain@v2

      # Installs Node from mise.toml and trusts its tasks. The version matches min_version there. No cache: a
      # cache written by another workflow could swap the Node that packs the published tarball.
      - uses: jdx/mise-action@v5
        with:
          version: 2026.8.14
          cache: false

      - name: Check the tag against all three versions
        run: |
          npm_version=$(node -p "require('./npm/package.json').version")
          crate_versions=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[].version' | sort -u)
          echo "tag=$GITHUB_REF_NAME npm=$npm_version crates=$crate_versions"
          test "$GITHUB_REF_NAME" = "v$npm_version"
          test "$GITHUB_REF_NAME" = "v$crate_versions"

      # The same steps as in ci.yml.
      - run: mise run lint:fmt
      - run: mise run lint:clippy
      - run: mise run lint:wasm
      - run: mise run test:rust

      - run: mise run deps

      # Also appends the wasm size table to $GITHUB_STEP_SUMMARY.
      - run: mise run build

      # Both reuse the build above, since nothing it reads changed.
      - run: mise run test:npm
      - run: mise run typecheck

      # The tarball is built once; the published file and the release asset are the same artifact.
      - id: pack
        run: echo "tarball=$(npm pack --silent)" >> "$GITHUB_OUTPUT"
        working-directory: npm

      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: npm/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  # Publishes the tarball from build and creates the GitHub release. It checks nothing out: the
  # tarball is all it needs.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # id-token: npm trusted publishing (OIDC) and provenance. contents: create the GitHub release.
      id-token: write
      contents: write
    steps:
      # No checkout here, so mise.toml is not available: the version must match it by hand. Node 24.18.0 ships
      # npm 11.16.0; trusted publishing needs 11.5.1 or newer.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v8
        with:
          name: npm-package

      # CI only stages the version: it goes live when the owner approves it on npm with 2FA
      # (`npm stage approve`), and the trusted publisher does not allow `npm publish`. A re-run skips
      # staging when the version is already on npm, so after approving, re-running this job finishes
      # the release. No token secret: npm authenticates through the trusted publisher configured on
      # npmjs.com. The build job checked that the tag is v plus the package version.
      - name: Stage on npm
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if published=$(npm view "htp-decompress@$version" version 2>view-error.txt); then
            :
          elif grep -q E404 view-error.txt; then
            published=""
          else
            cat view-error.txt
            exit 1
          fi
          if [ "$published" = "$version" ]; then
            echo "htp-decompress@$version is already on npm, skipping staging"
          else
            npm stage publish "$TARBALL" --provenance --access public
          fi

      - uses: softprops/action-gh-release@v3
        with:
          files: ${{ needs.build.outputs.tarball }}
